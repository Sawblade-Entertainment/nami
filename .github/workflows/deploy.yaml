name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - uses: actions/checkout@v3

      # Set up Python for MkDocs
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Install MkDocs and deploy to GitHub Pages
      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Deploy MkDocs to GitHub Pages
        run: mkdocs gh-deploy --force

      # Set up Rokit toolset
      - name: Setup Rojo/Wally
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          rokit install

      - name: Build with Rojo
        run: rojo build --output Nami.rbxm

      # Create GitHub Release/Deployment for Rojo artifact
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Nami.rbxm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Wally
        run: wally publish
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_TOKEN }}
