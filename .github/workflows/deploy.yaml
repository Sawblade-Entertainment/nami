name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - uses: actions/checkout@v3

      # Set up Python for MkDocs
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Install MkDocs and deploy to GitHub Page
      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material
      
      - name: Build MkDocs
        run: mkdocs build
      
      # Upload the built site for deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3

      # Set up Rokit toolset
      - name: Setup Rojo/Wally
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          rokit install

      - name: Build with Rojo
        run: rojo build --output Nami.rbxm

      # Create GitHub Release/Deployment for Rojo artifact
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Nami.rbxm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Wally
        run: wally publish
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_TOKEN }}
