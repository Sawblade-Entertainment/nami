name: Deploy

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-gitbook

      - name: Build MkDocs
        run: mkdocs build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Install Rokit
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install project tools
        run: rokit install --no-trust-check

      - name: Build with Rojo
        run: rojo build --output Nami.rbxm

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: nami-build
          path: Nami.rbxm
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: nami-build
          path: ./release

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Rokit
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install project tools
        run: rokit install --no-trust-check
      
      - name: Check with Selene
        run: selene .
      
      - name: Check formatting with Stylua
        run: stylua --check .

      - name: Publish to Wally
        run: |
          wally login --token=$WALLY_TOKEN
          wally publish
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_TOKEN }}
  
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: nami-build
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/Nami.rbxm
